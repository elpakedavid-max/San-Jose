name: Pruebas de la app

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'   # cada día ~07:17 (hora de Madrid en invierno)
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Permisos SQL e instalación desde cero (PostgreSQL aislado)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
          node tests/test_schema.mjs
      - name: Instalar Playwright
        run: |
          pip install pytest playwright
          playwright install --with-deps chromium
      - name: Sintaxis del JavaScript
        run: |
          python3 -c "import re;s=open('index.html').read();open('/tmp/app.js','w').write(re.search(r'<script>\n(\{.*\})\n</script>',s,re.S).group(1))"
          node --check /tmp/app.js
          node --check sw.js
      - name: Pruebas de caché del service worker
        run: node tests/test_sw.cjs
      - name: Pruebas de la app (Supabase simulado)
        run: pytest -q tests/test_app.py
      - name: Comprobar la web publicada
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LIVE: '1'
        run: pytest -q tests/test_live.py

